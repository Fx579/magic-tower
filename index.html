<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新魔塔 · 确定性之塔</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2026; --panel2: #222a33; --line: #2e3944;
    --fg: #d7e0e8; --dim: #8a98a6; --gold: #f0c040; --red: #e86a5a;
    --green: #5ad08a; --blue: #6ab0f0; --purple: #b08af0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 "SF Pro Text","PingFang SC",system-ui,sans-serif; display: flex; justify-content: center; padding: 16px; }
  #app { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  #left, #right { width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  h1 { font-size: 16px; margin-bottom: 8px; }
  h2 { font-size: 13px; color: var(--dim); margin: 10px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .stat { display: flex; justify-content: space-between; padding: 2px 0; }
  .stat b { font-family: Consolas, monospace; }
  .v-gold { color: var(--gold); } .v-green { color: var(--green); } .v-red { color: var(--red); } .v-blue { color: var(--blue); } .v-purple { color: var(--purple); }
  #board { image-rendering: pixelated; image-rendering: crisp-edges; border: 2px solid var(--line); border-radius: 6px; display: block; cursor: pointer; }
  #preview { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 130px; font-size: 13px; }
  #preview .row { display: flex; justify-content: space-between; }
  #msg { margin-top: 8px; color: var(--gold); min-height: 20px; font-size: 13px; }
  #controls { margin-top: 10px; display: flex; gap: 8px; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--green); }
  .help { color: var(--dim); font-size: 12px; line-height: 1.7; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 10; }
  #overlay.show { display: flex; }
  #overlay .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 32px; text-align: center; }
  #overlay .box h1 { font-size: 24px; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <h1>新魔塔 · 确定性之塔</h1>
    <h2>我方属性</h2>
    <div id="stats"></div>
    <h2>资源</h2>
    <div id="inv"></div>
    <h2>操作</h2>
    <div class="help">
      方向键 / WASD 移动（撞怪即战斗）<br>
      点击相邻格子移动或战斗<br>
      B：炸弹炸掉 facing 的怪物<br>
      走到传送阵 T 会瞬移；暗层传送需先拾取秘符<br>
      全塔 50 层 + 2 个隐藏暗层，决战在 50F<br>
      战斗预览在右侧，精确到每一点 HP
    </div>
    <div id="controls">
      <button id="btnSave">保存</button>
      <button id="btnLoad">读取</button>
      <button id="btnRestart">重开</button>
    </div>
  </div>
  <div id="center"><canvas id="board" width="832" height="832"></canvas></div>
  <div id="right">
    <h1 id="floorName">1F</h1>
    <div id="preview">走向怪物或与其相邻时，这里显示这场战斗的精确结算。</div>
    <div id="msg"></div>
    <h2>图例</h2>
    <div class="help" id="legend"></div>
  </div>
</div>
<div id="overlay"><div class="box"><h1 id="ovTitle"></h1><p id="ovText"></p><br><button id="btnOv">重新开始</button></div></div>

// 确定性战斗模拟：暴击/闪避用“计数器必触发”实现，结果完全可预测。
function simulate(p, m) {
  let mhp = m.hp, loss = 0, turns = 0;
  let pcrit = 0, pdodge = 0, mcrit = 0, mdodge = 0;
  const pDef = p.def, pBlock = p.block;
  for (let guard = 0; guard < 10000; guard++) {
    turns++;
    // 我方攻击
    mdodge += m.dodge;
    if (mdodge >= 100) { mdodge -= 100; }
    else {
      let mult = 1;
      pcrit += p.crit;
      if (pcrit >= 100) { pcrit -= 100; mult = 2; }
      mhp -= Math.max(0, p.atk * mult - m.def - m.block);
    }
    if (mhp <= 0) return { win: true, loss, turns };
    // 敌方攻击
    pdodge += p.dodge;
    if (pdodge >= 100) { pdodge -= 100; }
    else {
      let mult = 1;
      mcrit += m.crit;
      if (mcrit >= 100) { mcrit -= 100; mult = 2; }
      loss += Math.max(0, m.atk * mult - pDef - pBlock);
    }
    if (loss >= p.hp) return { win: false, loss: Infinity, turns };
  }
  return { win: false, loss: Infinity, turns }; // 打不动 = 无法取胜
}
function luckGold(luck) { return Math.floor(luck / 5); }
function chestReward(luck) {
  if (luck >= 25) return { type: "chest3", text: "神秘宝箱：攻+2 防+2 金币+20" };
  if (luck >= 10) return { type: "chest2", text: "神秘宝箱：黄钥匙+1 攻+2" };
  return { type: "chest1", text: "神秘宝箱：回复 80 HP" };
}
/*ENGINE_END*/

// ---------- 游戏状态 ----------
const PASSABLE = new Set([".", "U", "V", "T", "S", "P"]);
let S; // state
function freshState() {
  const floors = DATA.floors.map(f => f.map(r => r.split("")));
  let px = 0, py = 0;
  floors[0].forEach((row, y) => row.forEach((c, x) => { if (c === "P") { px = x; py = y; } }));
  floors[0][py][px] = ".";
  return {
    floors, px, py, floor: 0,
    face: [0, -1],
    p: JSON.parse(JSON.stringify(DATA.start)),
    log: []
  };
}

const MONSTER_CHARS = Object.keys(DATA.monsters);
function isMonster(c) { return MONSTER_CHARS.includes(c); }
function isDoor(c) { return c === "Y" || c === "B" || c === "R"; }
function doorKey(c) { return c === "Y" ? "y" : c === "B" ? "b" : "r"; }

function cellAt(f, x, y) { return S.floors[f][y][x]; }

function msg(t) {
  S.log.unshift(t);
  S.log = S.log.slice(0, 6);
  document.getElementById("msg").textContent = t;
}

function gain(ch) {
  const p = S.p;
  switch (ch) {
    case "y": p.keys.y++; msg("拾取 黄钥匙"); break;
    case "b": p.keys.b++; msg("拾取 蓝钥匙"); break;
    case "r": p.keys.r++; msg("拾取 红钥匙"); break;
    case "A": p.atk += 2; msg("力量宝石 攻+2"); break;
    case "D": p.def += 2; msg("防御宝石 防+2"); break;
    case "H": p.maxhp += 80; heal(80); msg("血瓶：上限+80 回复80"); break;
    case "G": p.gold += 15; msg("金币袋 +15"); break;
    case "e": p.crit += 10; msg("获得 暴击戒指：暴击+10"); break;
    case "f": p.dodge += 10; msg("获得 幻影披风：闪避+10"); break;
    case "g": p.block += 3; msg("获得 塔盾：格挡+3"); break;
    case "l": p.luck += 10; msg("获得 幸运护符：幸运+10"); break;
    case "!": p.bombs++; msg("获得 炸弹（B键对 facing 怪物使用）"); break;
    case "s": p.amulet = true; msg("获得秘符——暗层传送阵已解锁"); break;
    case "W": p.atk += 15; msg("圣剑 攻+15"); break;
    case "Q": p.def += 15; msg("圣盾 防+15"); break;
    case "h": p.hp = p.maxhp; msg("圣水：HP 回满"); break;
    case "C": {
      const r = chestReward(p.luck);
      if (r.type === "chest1") heal(80);
      else if (r.type === "chest2") { p.keys.y++; p.atk += 2; }
      else { p.atk += 2; p.def += 2; p.gold += 20; }
      msg(r.text);
      break;
    }
  }
}
function heal(n) { S.p.hp = Math.min(S.p.maxhp, S.p.hp + n); }

function tryMove(dx, dy) {
  if (S.over) return;
  S.face = [dx, dy];
  const nx = S.px + dx, ny = S.py + dy;
  if (nx < 0 || ny < 0 || nx >= DATA.W || ny >= DATA.H) { render(); return; }
  const c = cellAt(S.floor, nx, ny);
  if (c === "#") { render(); return; }
  if (isDoor(c)) {
    const k = doorKey(c);
    if (S.p.keys[k] > 0) {
      S.p.keys[k]--;
      S.floors[S.floor][ny][nx] = ".";
      msg("用" + { y: "黄", b: "蓝", r: "红" }[k] + "钥匙开门");
      render();
    } else msg("缺少" + { y: "黄", b: "蓝", r: "红" }[k] + "钥匙");
    return;
  }
  if (isMonster(c)) { fight(nx, ny, c); return; }
  S.px = nx; S.py = ny;
  enterCell(c, nx, ny);
  render();
}

function enterCell(c, x, y) {
  if (PASSABLE.has(c) || isMonster(c) || isDoor(c)) { /* stairs/shop handled below */ }
  if (c === "U") { S.floor++; S.py = findStair(S.floor, "V")[1]; S.px = findStair(S.floor, "V")[0]; msg("登上 " + (S.floor + 1) + "F"); }
  else if (c === "V") { S.floor--; const u = findStair(S.floor, "U"); S.px = u[0]; S.py = u[1]; msg("下到 " + (S.floor + 1) + "F"); }
  else if (c === "T") {
    const pair = DATA.tele.find(pr => pr[0] === S.floor || pr[1] === S.floor);
    if (!pair) { msg("传送阵沉寂无声"); return; }
    if (pair[2] === "s" && !S.p.amulet) { msg("传送阵暗淡无光（需要秘符）"); return; }
    const other = pair[0] === S.floor ? pair[1] : pair[0];
    const t = findStair(other, "T");
    S.floor = other; S.px = t[0]; S.py = t[1];
    msg("传送阵启动！");
  }
  else if (c === "S") { openShop(); }
  else if ("ybrADHGefgl!sWQh".includes(c)) {
    S.floors[S.floor][y][x] = ".";
    gain(c);
  } else if (c === "C") {
    S.floors[S.floor][y][x] = ".";
    gain("C");
  }
}
function findStair(f, ch) {
  for (let y = 0; y < DATA.H; y++) for (let x = 0; x < DATA.W; x++)
    if (S.floors[f][y][x] === ch) return [x, y];
  return [1, 1];
}

function fight(x, y, c) {
  const m = DATA.monsters[c];
  const r = simulate(S.p, m);
  if (!r.win) { msg("打不过 " + m.name + "（无法破防或掉血过多）"); return; }
  S.p.hp -= r.loss;
  S.p.gold += m.gold + luckGold(S.p.luck);
  S.floors[S.floor][y][x] = ".";
  msg("击败 " + m.name + "，掉血 " + r.loss + "，金币+" + (m.gold + luckGold(S.p.luck)));
  if (c === "E") { win(); return; }
  if (S.p.hp <= 0) { lose(); return; }
  render();
}

function bomb() {
  const nx = S.px + S.face[0], ny = S.py + S.face[1];
  if (nx < 0 || ny < 0 || nx >= DATA.W || ny >= DATA.H) return;
  const c = cellAt(S.floor, nx, ny);
  if (!isMonster(c) || c === "E") { msg("炸弹只能炸普通怪物"); return; }
  if (S.p.bombs <= 0) { msg("没有炸弹了"); return; }
  S.p.bombs--;
  S.floors[S.floor][ny][nx] = ".";
  msg("轰！" + DATA.monsters[c].name + " 灰飞烟灭");
  render();
}

function openShop() {
  const p = S.p;
  const lines = DATA.shop.map((it, i) => "[" + (i + 1) + "] " + it.label + " — " + it.cost + "金").join("\n");
  const sel = prompt("商店（金币 " + p.gold + "）\n" + lines + "\n\n输入编号购买，直接取消离开：");
  if (sel === null) return;
  const i = parseInt(sel, 10) - 1;
  if (i < 0 || i >= DATA.shop.length) return;
  const it = DATA.shop[i];
  if (p.gold < it.cost) { msg("金币不足"); render(); return; }
  p.gold -= it.cost;
  if (it.key === "heal") heal(80); else p[it.key] += (it.key === "atk" || it.key === "def") ? 2 : (it.key === "crit" ? 5 : (it.key === "block" ? 2 : 10));
  msg("购买 " + it.label);
  render();
}

function win() {
  S.over = true;
  document.getElementById("ovTitle").textContent = "通关！";
  document.getElementById("ovText").textContent = "你以剩余 HP " + S.p.hp + " 击败魔王。全程零随机——每一步都是你算出来的。";
  document.getElementById("overlay").classList.add("show");
}
function lose() {
  S.over = true;
  document.getElementById("ovTitle").textContent = "阵亡";
  document.getElementById("ovText").textContent = "HP 归零。预览面板永远是对的——下次先算账再走路。";
  document.getElementById("overlay").classList.add("show");
}

const spriteCache = {};
function makeSprite(name, pal) {
  const cv = document.createElement("canvas"); cv.width = 32; cv.height = 32;
  const cx = cv.getContext("2d");
  const art = ART[name];
  for (let y = 0; y < 32; y++) {
    const row = (art[y] || "").padEnd(32, ".").slice(0, 32);
    for (let x = 0; x < 32; x++) {
      const ch = row[x];
      const col = (pal && pal[ch]) || PAL[ch];
      if (col) { cx.fillStyle = col; cx.fillRect(x, y, 1, 1); }
    }
  }
  return cv;
}
function getSprite(name, pal) {
  const key = name + "|" + (pal ? JSON.stringify(pal) : "");
  if (!spriteCache[key]) spriteCache[key] = makeSprite(name, pal);
  return spriteCache[key];
}
function drawFloor(cx, x, y, T) {
  const gx = Math.round(x / T), gy = Math.round(y / T);
  cx.fillStyle = "#1c232b"; cx.fillRect(x, y, T, T);
  cx.fillStyle = "#252e38"; cx.fillRect(x + 1, y + 1, T - 2, 2); cx.fillRect(x + 1, y + 1, 2, T - 2);
  cx.fillStyle = "#141a21"; cx.fillRect(x + 2, y + T - 4, T - 4, 2); cx.fillRect(x + T - 4, y + 2, 2, T - 4);
  const h = (gx * 73856093 + gy * 19349663) >>> 0;
  cx.fillStyle = "#202932";
  cx.fillRect(x + 8 + (h % 44), y + 8 + ((h >> 4) % 44), 2, 2);
  cx.fillRect(x + 8 + ((h >> 8) % 44), y + 8 + ((h >> 12) % 44), 2, 2);
  cx.fillStyle = "#12181e";
  cx.fillRect(x + 3, y + 3, 2, 2); cx.fillRect(x + T - 5, y + 3, 2, 2);
  cx.fillRect(x + 3, y + T - 5, 2, 2); cx.fillRect(x + T - 5, y + T - 5, 2, 2);
}
function drawWall(cx, x, y, T) {
  cx.fillStyle = "#2a323b"; cx.fillRect(x, y, T, T);
  const bw = T / 2, bh = T / 4;
  for (let r = 0; r < 4; r++) {
    const off = (r % 2) ? -bw / 2 : 0;
    for (let c = -1; c < 3; c++) {
      const bx = Math.max(x, x + off + c * bw), by = y + r * bh;
      const w = Math.min(bw - 2, x + T - bx - 1);
      if (w <= 0) continue;
      const tint = (((Math.round(x / T)) * 7 + Math.round(y / T) * 13 + r * 3 + c * 5) % 3) * 5;
      cx.fillStyle = "rgb(" + (77 + tint) + "," + (90 + tint) + "," + (104 + tint) + ")"; cx.fillRect(bx, by + 1, w, bh - 2);
      cx.fillStyle = "#66788a"; cx.fillRect(bx, by + 1, w, 2);
      cx.fillStyle = "#39434e"; cx.fillRect(bx, by + bh - 2, w, 1);
    }
  }
}
function render() {
  const cv = document.getElementById("board");
  const cx = cv.getContext("2d");
  cx.imageSmoothingEnabled = false;
  cx.clearRect(0, 0, cv.width, cv.height);
  const T = 64, fx = S.px + S.face[0], fy = S.py + S.face[1];
  for (let y = 0; y < DATA.H; y++) for (let x = 0; x < DATA.W; x++) {
    const c = S.floors[S.floor][y][x], px = x * T, py = y * T;
    if (c === "#") drawWall(cx, px, py, T); else drawFloor(cx, px, py, T);
    const sp = CELL_SPRITE[c];
    if (sp) cx.drawImage(getSprite(sp[0], sp[1]), px, py, T, T);
    if (x === S.px && y === S.py) cx.drawImage(getSprite("hero"), px, py, T, T);
    if (x === fx && y === fy) { cx.strokeStyle = "#7ee0a0"; cx.lineWidth = 2; cx.strokeRect(px + 1, py + 1, T - 2, T - 2); }
  }
  const p = S.p;
  document.getElementById("stats").innerHTML =
    row("HP", p.hp + "/" + p.maxhp, "v-red") + row("攻", p.atk) + row("防", p.def) +
    (p.amulet ? row("秘符", "已持有", "v-purple") : "") +
    row("暴击", p.crit + "%", "v-gold") + row("闪避", p.dodge + "%", "v-blue") +
    row("格挡", p.block, "v-purple") + row("幸运", p.luck, "v-green");
  document.getElementById("inv").innerHTML =
    row("金币", p.gold, "v-gold") + row("黄/蓝/红钥匙", p.keys.y + "/" + p.keys.b + "/" + p.keys.r) + row("炸弹", p.bombs);
  const hid = DATA.tele.some(pr => pr[2] === "s" && (pr[0] === S.floor || pr[1] === S.floor));
  document.getElementById("floorName").textContent = hid ? "暗层 · " + String.fromCharCode(65 + S.floor - 50) : (S.floor + 1) + "F";
  updatePreview();
}
function row(k, v, cls) { return '<div class="stat"><span>' + k + "</span><b class=\"" + (cls || "") + "\">" + v + "</b></div>"; }

function updatePreview() {
  const el = document.getElementById("preview");
  const nx = S.px + S.face[0], ny = S.py + S.face[1];
  if (nx < 0 || ny < 0 || nx >= DATA.W || ny >= DATA.H) { el.textContent = "面对一堵墙。"; return; }
  const c = S.floors[S.floor][ny][nx];
  if (!isMonster(c)) { el.textContent = "面前：" + describe(c) + "\n（面对怪物时显示战斗结算）"; return; }
  const m = DATA.monsters[c];
  const r = simulate(S.p, m);
  const myDmg = Math.max(0, S.p.atk - m.def - m.block);
  const enDmg = Math.max(0, m.atk - S.p.def - S.p.block);
  el.innerHTML =
    "<b>" + m.name + "</b> HP" + m.hp + " 攻" + m.atk + " 防" + m.def +
    (m.crit ? " 暴" + m.crit + "%" : "") + (m.dodge ? " 闪" + m.dodge + "%" : "") + (m.block ? " 挡" + m.block : "") +
    '<div class="row"><span>我方伤害/回合</span><b>' + myDmg + "</b></div>" +
    '<div class="row"><span>敌方伤害/回合</span><b>' + enDmg + "</b></div>" +
    '<div class="row"><span>回合数</span><b>' + (r.win ? r.turns : "∞") + "</b></div>" +
    '<div class="row"><span>预计掉血</span><b class="v-red">' + (r.win ? r.loss : "—") + "</b></div>" +
    '<div class="row"><span>结算</span><b class="' + (r.win ? "v-green" : "v-red") + '">' +
    (r.win ? "打得过，剩 " + (S.p.hp - r.loss) : myDmg === 0 ? "无法破防" : "打不过") + "</b></div>";
}
function describe(c) {
  if (c === "#") return "墙";
  if (c === "Y") return "黄门（需黄钥匙）";
  if (c === "B") return "蓝门（需蓝钥匙）";
  if (c === "R") return "红门（需红钥匙）";
  if (c === "U") return "上楼梯";
  if (c === "V") return "下楼梯";
  if (c === "T") { const pr = DATA.tele.find(p => p[0] === S.floor || p[1] === S.floor); if (!pr) return "传送阵"; if (pr[2] === "s" && !S.p.amulet) return "传送阵（暗淡，需秘符）"; const o = pr[0] === S.floor ? pr[1] : pr[0]; return "传送阵 → " + (o >= 50 ? "暗层" + String.fromCharCode(65 + o - 50) : (o + 1) + "F"); }
  if (c === "S") return "商店";
  if (c === "C") return "神秘宝箱（当前幸运 " + S.p.luck + "：" + chestReward(S.p.luck).text.split("：")[1] + "）";
  if ("ybr".includes(c)) return "钥匙";
  if (c === "A") return "力量宝石 攻+2";
  if (c === "D") return "防御宝石 防+2";
  if (c === "H") return "血瓶：上限+80 回复80";
  if (c === "G") return "金币袋 +15";
  if (c === "e") return "暴击戒指 暴击+10";
  if (c === "f") return "幻影披风 闪避+10";
  if (c === "g") return "塔盾 格挡+3";
  if (c === "l") return "幸运护符 幸运+10";
  if (c === "!") return "炸弹";
  if (c === "s") return "秘符：解锁暗层传送阵";
  if (c === "W") return "圣剑 攻+15";
  if (c === "Q") return "圣盾 防+15";
  if (c === "h") return "圣水 HP回满";
  return "空地";
}

  ["Z","黑袍僧·暴击"],["J","僵尸"],["K","狼人·暴击"],["L","双头狗·格挡"],["M","木乃伊·高防"],["N","骷髅法师"],["F","红法师"],["X","巫师·守关"],["E","魔王·BOSS"],
  ["key","钥匙"],["door","门"],["gem","宝石"],["heart","血瓶·上限+80"],["bag","金币袋"],["chest","神秘宝箱"],["ring","暴击戒指"],["cloak","幻影披风"],["shield","塔盾"],["clover","幸运护符"],["bomb","炸弹"],
  ["W","圣剑·攻+15"],["Q","圣盾·防+15"],["h","圣水·回满"],["s","秘符·解锁暗层"],
  ["shop","商店"],["tele","传送阵"],["stairU","上楼"],["stairV","下楼"]
];
function buildLegend() {
  const el = document.getElementById("legend"); el.innerHTML = "";
  LEGEND.forEach(([k, label]) => {
    const sp = CELL_SPRITE[k] || [k];
    const c = document.createElement("canvas"); c.width = 32; c.height = 32;
    c.style.cssText = "width:32px;height:32px;image-rendering:pixelated;vertical-align:-8px;margin:2px 3px 2px 8px;";
    c.getContext("2d").drawImage(getSprite(sp[0], sp[1]), 0, 0);
    const s = document.createElement("span"); s.textContent = label;
    el.appendChild(c); el.appendChild(s);
  });
}
buildLegend();

document.getElementById("board").addEventListener("click", e => {
  const r = e.target.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) * (e.target.width / r.width) / 64);
  const y = Math.floor((e.clientY - r.top) * (e.target.height / r.height) / 64);
  const dx = x - S.px, dy = y - S.py;
  if (Math.abs(dx) + Math.abs(dy) === 1) tryMove(dx, dy);
});

document.addEventListener("keydown", e => {
  const k = e.key;
  const map = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
  if (map[k]) { e.preventDefault(); tryMove(...map[k]); }
  else if (k === "b" || k === "B") bomb();
});
document.getElementById("btnSave").onclick = () => { localStorage.setItem("newmt", JSON.stringify(S)); msg("已保存"); };
document.getElementById("btnLoad").onclick = () => {
  const d = localStorage.getItem("newmt");
  if (d) { S = JSON.parse(d); render(); msg("已读取"); } else msg("没有存档");
};
document.getElementById("btnRestart").onclick = () => { S = freshState(); render(); };
document.getElementById("btnOv").onclick = () => {
  document.getElementById("overlay").classList.remove("show");
  S = freshState(); render();
};

S = freshState();
