<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔塔 · 经典50层</title>
<style>
  :root {
    --bg: #0d1117; --panel: #1b232c; --panel2: #242e38; --line: #33404d;
    --fg: #e6edf3; --dim: #97a5b3; --gold: #f0c040; --red: #ff6b5e;
    --green: #57d38a; --blue: #6ab0f0; --purple: #b78af5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 "Segoe UI","PingFang SC",system-ui,sans-serif; display: flex; justify-content: center; padding: 14px; }
  #app { display: flex; gap: 12px; align-items: flex-start; }
  #left, #right { width: 272px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .title { text-align: center; font-size: 22px; letter-spacing: 8px; font-weight: 700; color: var(--gold); text-shadow: 0 2px 0 #000; }
  #floorLabel { text-align: center; font-size: 15px; color: var(--dim); margin-bottom: 8px; }
  h2 { font-size: 12px; color: var(--dim); margin: 12px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; letter-spacing: 2px; }
  .srow { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .srow img { width: 24px; height: 24px; image-rendering: pixelated; }
  .srow .ic { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
  .srow b { margin-left: auto; font-family: Consolas, monospace; font-size: 16px; }
  .v-hp { color: var(--red); } .v-atk { color: var(--gold); } .v-def { color: var(--blue); } .v-gold { color: #ffd970; }
  #board { image-rendering: pixelated; image-rendering: crisp-edges; border: 2px solid var(--line); border-radius: 6px; display: block; cursor: pointer; background: #000; }
  #preview { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 190px; font-size: 13px; }
  #preview .mhead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  #preview .mhead img { width: 44px; height: 44px; image-rendering: pixelated; }
  #preview .mhead .mn { font-size: 16px; font-weight: 700; }
  #preview .row { display: flex; justify-content: space-between; padding: 1px 0; }
  #preview .row b { font-family: Consolas, monospace; }
  #preview .verdict { margin-top: 6px; padding: 5px 8px; border-radius: 6px; font-weight: 700; }
  #preview .ok { background: #12351f; color: var(--green); }
  #preview .no { background: #3a1614; color: var(--red); }
  #log { margin-top: 8px; color: var(--dim); font-size: 12px; max-height: 120px; overflow: auto; line-height: 1.7; }
  #log .hl { color: var(--gold); }
  #controls { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--green); }
  .help { color: var(--dim); font-size: 12px; line-height: 1.7; }
  .slot { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 4px 0; }
  .slot img { width: 26px; height: 26px; image-rendering: pixelated; }
  .slot .nm { font-weight: 700; } .slot .vl { margin-left: auto; color: var(--dim); font-family: Consolas, monospace; }
  #bag { display: flex; flex-wrap: wrap; gap: 6px; }
  #bag .item { position: relative; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px; width: 54px; text-align: center; cursor: pointer; }
  #bag .item img { width: 34px; height: 34px; image-rendering: pixelated; }
  #bag .item .cnt { position: absolute; right: 2px; top: 2px; font-size: 11px; color: var(--gold); font-family: Consolas, monospace; }
  #bag .item:hover { border-color: var(--gold); }
  #bag .tip { width: 100%; color: var(--dim); font-size: 12px; min-height: 16px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.78); display: none; align-items: center; justify-content: center; z-index: 20; }
  .modal.show { display: flex; }
  .modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; max-width: 760px; max-height: 88vh; overflow: auto; }
  .modal .box h1 { font-size: 18px; margin-bottom: 10px; color: var(--gold); }
  #dlgBox { min-width: 460px; max-width: 620px; }
  #dlgText { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-height: 74px; white-space: pre-wrap; font-size: 15px; line-height: 1.8; }
  #dlgName { color: var(--gold); font-weight: 700; margin-bottom: 6px; }
  #dlgBtns { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }
  #manualGrid { display: grid; grid-template-columns: repeat(4, 172px); gap: 8px; }
  #manualGrid .mc { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; }
  #manualGrid .mc img { width: 34px; height: 34px; image-rendering: pixelated; vertical-align: middle; }
  #manualGrid .mc .nm { font-weight: 700; font-size: 13px; }
  #manualGrid .mc .st { display: flex; justify-content: space-between; color: var(--dim); }
  #shopBox .sopt { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  #shopBox .sopt button { min-width: 170px; }
  #ovTitle { font-size: 26px; margin-bottom: 10px; }
  #hintPanel { width: 272px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: none; }
  #hintPanel.show { display: block; }
  .hint-item { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 6px 0; cursor: pointer; font-size: 12px; line-height: 1.6; }
  .hint-item:hover { border-color: var(--gold); }
  .hint-item .hn { font-weight: 700; }
  .hint-item .hd { color: var(--dim); }
  .hint-item .hw { color: #ff9f40; font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div class="title">魔 塔</div>
    <div id="floorLabel">1F</div>
    <div id="stats"></div>
    <h2>装备 / 钥匙</h2>
    <div id="equip"></div>
    <h2>道具</h2>
    <div id="bag"></div>
    <div id="controls">
      <button id="btnSave">保存</button>
      <button id="btnLoad">读取</button>
      <button id="btnRestart">重开</button>
      <button id="btnManual">怪物手册</button>
      <button id="btnHint">攻略提示</button>
    </div>
    <h2>操作</h2>
    <div class="help">
      方向键 / WASD 移动，撞怪即战斗<br>
      点击相邻格移动；点击怪物先预览再攻击<br>
      战斗完全确定：预览掉血 = 实际掉血<br>
      道具点击使用；40层起小心巫师与魔法警卫<br>
      提示：44F 需从 45F 使用降落之羽；0F 需从 1F 使用降落之羽
    </div>
  </div>
  <div id="center"><canvas id="board" width="704" height="704"></canvas></div>
  <div id="right">
    <h2 style="margin-top:0">怪物信息</h2>
    <div id="preview">点击怪物查看这场战斗的精确结算。</div>
    <div id="log"></div>
  </div>
  <div id="hintPanel">
    <h2 style="margin-top:0">攻略提示</h2>
    <div id="hintList"><div class="help">点击「攻略提示」按钮计算推荐。</div></div>
  </div>
</div>

<div class="modal" id="overlay"><div class="box" style="text-align:center"><h1 id="ovTitle"></h1><p id="ovText"></p><br><button id="btnOv">重新开始</button></div></div>
<div class="modal" id="dlgModal"><div class="box" id="dlgBox"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgBtns"></div></div></div>
<div class="modal" id="manualModal"><div class="box"><h1>怪物手册</h1><div id="manualGrid"></div><br><button id="btnManualClose">关闭</button></div></div>
<div class="modal" id="shopModal"><div class="box" id="shopBox"></div></div>

const N = DATA.N, CELL = 64, DIRS = [-11, 1, 11, -1];
const IDX = (x, y) => y * N + x;
const XY = i => [i % N, (i / N) | 0];
const $ = s => document.querySelector(s);

/* ---------- 运行时格子 ---------- */
function buildFloor(f) {
  const cells = new Array(N * N).fill(null);
  const rows = DATA.floors[f], det = DATA.details[f];
  for (let i = 0; i < N * N; i++) {
    const ch = rows[(i / N) | 0][i % N], d = det[i];
    if (ch === "#") cells[i] = { k: "wall" };
    else if (ch === "L") cells[i] = { k: "lava" };
    else if (ch === "U") cells[i] = { k: "stair", up: 1 };
    else if (ch === "V") cells[i] = { k: "stair", up: 0 };
    else if (ch === "u") cells[i] = { k: "stair", up: 1, hide: 1 };
    else if (ch === "v") cells[i] = { k: "stair", up: 0, hide: 1 };
    else if (ch === "Y") cells[i] = { k: "door", id: 1001, ds: d?.ds };
    else if (ch === "B") cells[i] = { k: "door", id: 1002, ds: d?.ds };
    else if (ch === "R") cells[i] = { k: "door", id: 1003, ds: d?.ds };
    else if (ch === "D") cells[i] = { k: "door", id: d.id, ds: d?.ds, opens: d?.opens ? d.opens.slice() : null };
    else if (ch === "M") cells[i] = { k: "mon", id: d.id, fa: !!d.fa, hide: !!d.hide, ev: d.ev };
    else if (ch === "g") cells[i] = { k: "mon", id: d.id, fa: !!d.fa, hide: !!d.hide, big: DATA.monsters[d.id].big, ev: d.ev };
    else if (ch === "i") cells[i] = { k: "prop", id: d.id, hide: !!d.hide, ev: d.ev };
    else if (ch === "N") cells[i] = { k: "npc", id: d.id, hide: !!d.hide, ev: d.ev };
    else if (ch === "E") cells[i] = { k: "ev", id: d.id };
    else if (ch === "S") cells[i] = { k: "shop" };
  }
  if (!S.meRem[key(f, 0)]) S.meRem[key(f, 0)] = (DATA.me[f] || []).map(g => ({ ev: g.ev, idx: g.idx.slice() }));
  if (!S.dmeRem[key(f, 0)]) S.dmeRem[key(f, 0)] = (DATA.dme[f] || []).map(g => ({ ev: g.ev, kill: g.kill.slice(), exist: g.exist.slice(), cancel: false }));
  return cells;
}
function cellsOf(f) { if (!S.cells[f]) S.cells[f] = buildFloor(f); return S.cells[f]; }
function cell(f, i) { return cellsOf(f)[i]; }
function setCell(f, i, c) { cellsOf(f)[i] = c; }
function clearCell(f, i) { const c = cell(f, i); setCell(f, i, c && c.ev ? { k: "ev", id: c.ev } : null); }

/* ---------- 状态 ---------- */
let S;
function newGame() {
  S = {
    floor: DATA.heroStart.floor, x: DATA.heroStart.x, y: DATA.heroStart.y, dir: DATA.heroStart.dir,
    hp: DATA.start.hp, atk: DATA.start.atk, def: DATA.start.def, gold: 0,
    swordId: 0, shieldId: 0, props: {},
    visited: {}, cells: {}, dead: {},
    meRem: {}, dmeRem: {}, mdRem: {}, doorB: {}, doorCancel: {}, appearRem: {},
    npcSt: {}, weak: {}, levelEv: {}, evDone: {},
    shop: { count: 0, beginGold: DATA.shopCfg.beginGold },
    over: false, won: false
  };
  S.visited[S.floor] = 1;
  renderAll();
}
const key = (f, i) => f + ":" + i;

/* ---------- 消息 ---------- */
function log(msg, hl) {
  const el = $("#log"); const d = document.createElement("div");
  if (hl) d.className = "hl"; d.textContent = msg; el.prepend(d);
  while (el.children.length > 40) el.removeChild(el.lastChild);
}

/* ---------- 属性/道具 ---------- */
function propNum(id) { return S.props[id] || 0; }
function addProp(id, count) { S.props[id] = (S.props[id] || 0) + (count || 1); }
function region() { return S.floor >= 1 ? Math.floor((S.floor - 1) / 10) + 1 : 0; }
function eatProp(id) {
  const p = DATA.items[id];
  if (!p) return;
  switch (p.type) {
    case 1: addProp(id, p.initNum); log("获得 " + p.name); break;            // 钥匙
    case 2: S.hp += p.v + region(); log("获得 " + p.name + "，生命 +" + (p.v + region())); break;
    case 3: S.atk += p.v + region(); log("获得 " + p.name + "，攻击 +" + (p.v + region())); break;
    case 4: S.def += p.v + region(); log("获得 " + p.name + "，防御 +" + (p.v + region())); break;
    case 5: S.atk += p.v; S.swordId = id; log("装备 " + p.name + "，攻击 +" + p.v); break;
    case 6: S.def += p.v; S.shieldId = id; log("装备 " + p.name + "，防御 +" + p.v); break;
    case 15: { const g = S.atk + S.def; S.hp += g; log("圣水生效，生命 +" + g); } break;
    default: addProp(id, p.initNum); log("获得 " + p.name); break;
  }
}

/* ---------- 战斗 ---------- */
function monStats(f, i) {
  const c = cell(f, i); if (!c) return null;
  const m = DATA.monsters[c.id];
  const r = S.weak[key(f, i)];
  if (!r) return m;
  return { name: m.name, hp: Math.ceil(m.hp * r), atk: Math.ceil(m.atk * r), def: Math.ceil(m.def * r), gold: m.gold, ed: m.ed, ma: m.ma, boss: m.boss, eventId: m.eventId, big: m.big };
}
function simulate(m, fa) {
  let atk = S.atk;
  if (m.ed && propNum(m.ed) > 0) atk *= 2;                       // 十字架/屠龙匕
  if (atk <= m.def) return { canWin: false, loss: 0, count: 0 };
  const count = Math.ceil(m.hp / (atk - m.def));
  const hd = Math.max(0, m.atk - S.def);
  const mcount = hd > 0 ? Math.ceil(S.hp / hd) : 0;
  const canWin = mcount === 0 || count < mcount || (count === mcount && !fa);
  const loss = canWin ? (fa ? count : count - 1) * hd : 0;
  return { canWin, loss, count };
}
function fight(i) {
  const f = S.floor, c = cell(f, i);
  if (!c || c.k !== "mon") return;
  const m = monStats(f, i);
  const sim = simulate(m, c.fa);
  if (!sim.canWin) { log("打不过 " + m.name + "！"); return; }
  S.hp -= sim.loss;
  const g = m.gold * (propNum(27) ? 2 : 1);
  S.gold += g;
  log("击杀 " + m.name + "，损失 " + sim.loss + " 生命，获得 " + g + " 金币");
  const cid = c.id;
  removeMonster(f, i);
  if (S.hp <= 0) { gameOver(false); return; }
  onKill(f, i, m);
  if (cid === 133 && !S.won) { S.won = true; gameOver(true); }
  renderAll();
}
function removeMonster(f, i) {
  const c = cell(f, i);
  clearCell(f, i);
  if (!S.dead[f]) S.dead[f] = {};
  S.dead[f][i] = 1;
  if (c && c.big) c.big.forEach(o => setCell(f, i + o, null));
}
function onKill(f, i, m) {
  const dead = S.dead[f] || {};
  // 静态怪物门
  const cs = cellsOf(f);
  for (let j = 0; j < cs.length; j++) {
    const c = cs[j];
    if (c && c.k === "door" && c.opens && c.opens.every(k => dead[k])) { setCell(f, j, null); doorOpened(f, j); }
  }
  // 事件怪物门
  (S.mdRem[key(f, 0)] || []).forEach(grp => {
    if (grp.mon.includes(i)) grp.mon = grp.mon.filter(k => k !== i);
    if (grp.mon.length === 0) grp.doors.forEach(d => setCell(f, d, null));
  });
  // 41F 怪物条件门
  const de = DATA.doorEv[f];
  if (de.monsterCond && de.monsterCond[1] === i) {
    const dc = cell(f, de.monsterCond[0]);
    if (dc && dc.k === "door") dc.ds = null;
  }
  // me / dme
  let done = false;
  (S.meRem[key(f, 0)] || []).forEach(g => {
    if (g.idx.includes(i)) g.idx = g.idx.filter(k => k !== i);
    if (g.idx.length === 0 && !g.fired) { done = true; g.fired = true; runEvent(g.ev); }
  });
  (S.dmeRem[key(f, 0)] || []).forEach(g => {
    if (g.exist.includes(i)) g.cancel = true;
    if (!g.cancel && g.kill.includes(i)) g.kill = g.kill.filter(k => k !== i);
    if (!g.cancel && g.kill.length === 0 && !g.fired) { done = true; g.fired = true; runEvent(g.ev); }
  });
  if (!done && m.eventId) runEvent(m.eventId);
}
function doorOpened(f, i) {
  const de = DATA.doorEv[f];
  if (!de.disappear) return;
  const [A, ev, B] = de.disappear;
  if (A.includes(i)) { S.doorCancel[f] = 1; return; }
  if (S.doorCancel[f]) return;
  if (!S.doorB[f]) S.doorB[f] = B.slice();
  S.doorB[f] = S.doorB[f].filter(k => k !== i);
  if (S.doorB[f].length === 0) runEvent(ev);
}

/* ---------- 楼层切换 ---------- */
function switchLevel(diff, viaFeather) {
  const t = S.floor + diff;
  const min = viaFeather ? 0 : 1;
  if (t < min || t > 50) return false;
  S.visited[t] = 1;
  S.floor = t;
  const st = DATA.stairs[t];
  const stand = diff > 0 ? (st.down ? st.down.stand : -1) : (st.up ? st.up.stand : -1);
  if (stand >= 0) { const [x, y] = XY(stand); S.x = x; S.y = y; }
  triggerLevelEvent(t);
  return true;
}
function jumpLevel(lv, x, y) {
  S.visited[lv] = 1; S.floor = lv; S.x = x; S.y = y;
  triggerLevelEvent(lv);
}
function triggerLevelEvent(lv) {
  const ev = S.levelEv[lv];
  if (ev) { delete S.levelEv[lv]; runEvent(ev); }
}

/* ---------- 事件系统 ---------- */
function runEvent(id) {
  const ev = DATA.events[id];
  if (!ev) return;
  if (ev.save != null && ev.save !== S.floor) { S.levelEv[ev.save] = id; return; }
  const steps = ev.step || [];
  let si = 0, ai = 0, di = 0;
  const next = () => {
    while (si < steps.length) {
      const cmd = steps[si++];
      if (!cmd) continue;
      if (cmd === "chat") {
        const lines = (ev.chat || []).map(l => Array.isArray(l) ? l.join("\n") : l);
        queueDialog(lines, null, next);
        return;
      }
      if (cmd === "appear") applyAppear((ev.appear || [])[ai++]);
      else if (cmd === "disappear") applyDisappear((ev.disappear || [])[di++]);
      else applyCmd(cmd, ev);
    }
  };
  next();
}
function applyAppear(a) {
  if (!a) return;
  const f = S.floor;
  const ln = a.layer;
  const blocks = typeof ln === "string" ? [[ln, a[ln] || []]] : Object.keys(ln).map(k => [k, ln[k] || []]);
  blocks.forEach(([name, pairs]) => {
    if (name === "monster") pairs.forEach(p => setCell(f, p[0], { k: "mon", id: p[1], big: DATA.monsters[p[1]].big }));
    else if (name === "prop") pairs.forEach(p => setCell(f, p[0], { k: "prop", id: p[1] }));
    else if (name === "npc") pairs.forEach(p => setCell(f, p[0], { k: "npc", id: p[1] }));
    else if (name === "door") pairs.forEach(p => setCell(f, p[0], { k: "door", id: p[1], opens: null }));
    else if (name === "wall") pairs.forEach(p => setCell(f, p[0], { k: "wall" }));
    else if (name === "event") pairs.forEach(p => setCell(f, p[0], { k: "ev", id: p[1] }));
    else if (name === "lava") pairs.forEach(p => setCell(f, p[0], { k: "lava" }));
  });
}
function applyDisappear(d) {
  if (!d) return;
  const f = S.floor;
  if (d.wall) d.wall.forEach(i => setCell(f, i, null));
  if (d.door) d.door.forEach(i => setCell(f, i, null));
  if (d.event) d.event.forEach(i => setCell(f, i, null));
  if (d.monster) d.monster.forEach(i => removeMonster(f, i));
  if (d.npc) d.npc.forEach(i => clearCell(f, i));
  if (d.prop) d.prop.forEach(i => clearCell(f, i));
  if (d.lava) d.lava.forEach(i => setCell(f, i, null));
}
function applyCmd(cmd, ev) {
  const f = S.floor;
  switch (cmd) {
    case "monsterDoor": {
      const groups = [];
      for (const k in ev.monsterDoor) groups.push({ mon: k.split(",").map(Number), doors: ev.monsterDoor[k] });
      const arr = S.mdRem[key(f, 0)] || (S.mdRem[key(f, 0)] = []);
      groups.forEach(g => arr.push(g));
      groups.forEach(g => { if (g.mon.every(i => S.dead[f] && S.dead[f][i])) g.doors.forEach(d => setCell(f, d, null)); });
      break;
    }
    case "weak": { const ws = Array.isArray(ev.weak[0]) ? ev.weak : [ev.weak]; ws.forEach(w => { S.weak[key(f, w[0])] = w[1]; }); break; }
    case "jump": { const j = ev.jump; jumpLevel(j[0], j[1], j[2]); break; }
    case "beAttack":
      if (ev.beAttack.hero) { S.atk = DATA.weaken.attack; S.def = DATA.weaken.defence; S.hp = DATA.weaken.hp; S.swordId = 0; S.shieldId = 0; log("你被伏击了，属性大幅下降…", 1); }
      break;
    case "sceneAppear": { const sa = ev.sceneAppear; S.visited[sa[0]] = 1; S.floor = sa[0]; const [x, y] = XY(sa[1]); S.x = x; S.y = y; triggerLevelEvent(sa[0]); break; }
    case "sceneDisappear": break;
    case "show": { const c = cell(f, ev.show); if (c) c.hide = 0; break; }
    case "clearNpcEvent": { const st = npcState(f, ev.clearNpcEvent); st.noEvent = 1; break; }
    case "do": {
      const c = cell(f, ev.do);
      if (c) {
        if (c.k === "mon") fight(ev.do);
        else if (c.k === "ev") { const id = c.id; setCell(f, ev.do, null); runEvent(id); }
      }
      break;
    }
    default: break; // move/specialMove/sound/stopSound/save 省略
  }
  renderAll();
}

/* ---------- NPC ---------- */
function npcState(f, i) {
  const c = cell(f, i);
  const k = c && c.k === "npc" ? "n" + c.id : i;
  if (!S.npcSt[k]) S.npcSt[k] = { step: 0, noEvent: 0 };
  return S.npcSt[k];
}
function npcInteract(i) {
  const f = S.floor, c = cell(f, i);
  if (!c || c.k !== "npc") return;
  const info = DATA.npcs[c.id];
  const st = npcState(f, i);
  const name = "";
  if (info.type === 1) { // 强盗/小偷
    let lines;
    if (info.eventTalk && !st.noEvent) lines = [Array.isArray(info.eventTalk) ? info.eventTalk.join("\n") : info.eventTalk];
    else lines = info.talk ? [info.talk[Math.min(st.step, info.talk.length - 1)]] : [];
    queueDialog(lines, name, () => {
      if (info.wall && info.wall[st.step] != null) setCell(f, info.wall[st.step], null);
      if (info.move) {
        const mv = info.move[st.step];
        if (mv != null) { setCell(f, mv, c); setCell(f, i, null); st.step++; }
        else { clearCell(f, i); }
        if (info.event && !st.noEvent) { st.noEvent = 1; runEvent(info.event); }
      } else if (info.event && !st.noEvent) { st.noEvent = 1; runEvent(info.event); }
      renderAll();
    });
    return;
  }
  if (info.type === 2) { // 老人
    if (info.value && info.value.prop && !st.traded) {
      st.traded = 1;
      rewardDialog(info.talk[0], name, () => { eatProp(info.value.prop); clearCell(f, i); });
      return;
    }
    const line = info.talk ? info.talk[Math.min(st.step, info.talk.length - 1)] : "";
    queueDialog([line], name, () => {
      st.step++;
      if (info.value && info.value.gold) { S.gold += info.value.gold; log("获得 " + info.value.gold + " 金币"); }
      if (!info.talk || st.step >= info.talk.length) clearCell(f, i);
      renderAll();
    });
    return;
  }
  if (info.type === 3) { // 商人
    const v = info.value;
    if (v && v.propGold != null && !st.traded) {
      const cost = v.propGold < 0 ? -v.propGold : 0;
      const sell = v.propGold > 0;
      rewardDialog(info.talk[0] + (sell ? "\n（卖出 " + DATA.items[v.prop] + "，获得 " + v.propGold + " 金币）" : "\n（花费 " + cost + " 金币购买 " + DATA.items[v.prop] + "）"), name, () => {
        if (sell) { if (propNum(v.prop) <= 0) { log("你没有 " + DATA.items[v.prop].name); return; } addProp(v.prop, v.count || -1); S.gold += v.propGold; }
        else { if (S.gold < cost) { log("金币不足！"); return; } S.gold -= cost; addProp(v.prop, v.count || 1); }
        if (!v.unlimit) { st.traded = 1; if (info.talk && info.talk[1]) { queueDialog([info.talk[1]], name, () => clearCell(f, i)); } else clearCell(f, i); }
        renderAll();
      });
      return;
    }
    if (v && v.hp != null) {
      rewardDialog(info.talk[0] + "\n（花费 " + (-v.hp) + " 金币，生命 +" + 2000 + "）", name, () => {
        if (S.gold < -v.hp) { log("金币不足！"); return; }
        S.gold += v.hp; S.hp += 2000;
        if (!v.unlimit) { if (info.talk && info.talk[1]) queueDialog([info.talk[1]], name, () => clearCell(f, i)); else clearCell(f, i); }
        renderAll();
      });
      return;
    }
    if (v && (v.attack || v.defence)) {
      const line = info.talk[Math.min(st.step, info.talk.length - 1)];
      queueDialog([line], name, () => {
        st.step++;
        if (st.step >= info.talk.length) {
          S.atk = Math.ceil(S.atk * (1 + v.attack / 100)); S.def = Math.ceil(S.def * (1 + v.defence / 100));
          log("接受了祝福！攻击/防御提升", 1);
          clearCell(f, i);
        }
        renderAll();
      });
      return;
    }
    const line = info.talk ? info.talk[Math.min(st.step, info.talk.length - 1)] : "";
    queueDialog([line], name, () => { st.step++; if (!info.talk || st.step >= info.talk.length) clearCell(f, i); renderAll(); });
    return;
  }
  if (info.type === 5) { // 公主
    const raw = info.talk[Math.min(st.step, info.talk.length - 1)];
    const lines = Array.isArray(raw) ? [raw.join("\n")] : [raw];
    queueDialog(lines, name, () => {
      st.step++;
      if (info.event && !st.noEvent) { st.noEvent = 1; runEvent(info.event); }
      renderAll();
    });
    return;
  }
  // 默认
  const line = info.talk ? info.talk[Math.min(st.step, info.talk.length - 1)] : "";
  queueDialog([line], name, () => { st.step++; if (!info.talk || st.step >= info.talk.length) clearCell(f, i); renderAll(); });
}

  const cnt = S.shop.count;
  const price = S.shop.beginGold + cfg.ratio * cnt;
  const hpG = (cnt + 1) * cfg.hp, atkG = (lv + 1) * cfg.attack, defG = (lv + 1) * cfg.defence;

    '<div class="sopt"><button id="buyAtk">攻击 +' + atkG + '</button><span>' + price + ' 金币</span></div>' +
    '<div class="sopt"><button id="buyDef">防御 +' + defG + '</button><span>' + price + ' 金币</span></div>' +

/* ---------- 移动与碰撞 ---------- */
function heroIdx() { return IDX(S.x, S.y); }
function tryMove(d) {
  if (S.over || dlgQueue.length || $("#dlgModal").classList.contains("show") || $("#shopModal").classList.contains("show")) return;
  S.dir = d;
  const di = DIRS[d];
  const hi = heroIdx(), ni = hi + di;
  if (di === -11 && hi < N) return; if (di === 11 && hi >= N * (N - 1)) return;
  if (di === 1 && hi % N === N - 1) return; if (di === -1 && hi % N === 0) return;
  collide(ni);
}
function collide(i) {
  const f = S.floor, c = cell(f, i);
  const [x, y] = XY(i);
  const stand = () => { S.x = x; S.y = y; };
  if (!c) { stand(); damageCollision(i); renderAll(); return; }
  switch (c.k) {
    case "wall": renderAll(); return;
    case "lava": log("熔岩无法通过（可用冰冻徽章）"); return;
    case "prop": if (c.hide) { stand(); renderAll(); return; } eatProp(c.id); clearCell(f, i); stand(); renderAll(); return;
    case "shop": stand(); renderAll(); openShop(); return;
    case "stair": {
      stand();
      const diff = c.up ? DATA.stairs[f].up.diff : DATA.stairs[f].down.diff;
      if (switchLevel(diff, false)) { renderAll(); }
      return;
    }
    case "mon": if (c.hide) { stand(); renderAll(); return; } fight(i); return;
    case "npc": if (c.hide) { stand(); renderAll(); return; } npcInteract(i); return;
    case "ev": { const id = c.id; stand(); runEvent(id); return; }
    case "door": doorCollision(i, c); return;
  }
}
function doorCollision(i, c) {
  const f = S.floor;
  if (c.ds === "a") { // 隐藏门，撞上现形
    c.ds = null;
    const de = DATA.doorEv[f];
    if (de.appearEvent) {
      if (!S.appearRem[f]) S.appearRem[f] = de.appearEvent.idx.slice();
      S.appearRem[f] = S.appearRem[f].filter(k => k !== i);
      if (S.appearRem[f].length === 0) runEvent(de.appearEvent.ev);
    }
    log("发现一扇暗门！");
    renderAll(); return;
  }
  if (c.ds === "h") { renderAll(); return; }
  if (c.id === 1006) { // 墙门
    if (c.ds === "p") { renderAll(); return; }
    setCell(f, i, null);
    const de = DATA.doorEv[f];
    if (de.wallShow != null) { const sc = cell(f, de.wallShow); if (sc) sc.hide = 0; }
    log("打开了墙门");
    renderAll(); return;
  }
  if (c.id >= 1004) { log("怪物门：击杀对应怪物后自动打开"); renderAll(); return; }
  const keyId = Object.keys(DATA.items).find(k => DATA.items[k].v === c.id && DATA.items[k].type === 1);
  if (!keyId || propNum(+keyId) <= 0) { log("需要 " + DATA.items[keyId].name); renderAll(); return; }
  addProp(+keyId, -1);
  setCell(f, i, null);
  doorOpened(f, i);
  renderAll();
}
function damageCollision(i) {
  const f = S.floor;
  if (f < 40) return;
  if (S.shieldId === 17) return; // 神圣盾免疫魔法
  const cs = cellsOf(f);
  const live = j => { const c = cs[j]; return c && c.k === "mon" && !c.hide; };
  // 巫师：相邻
  let wd = 0; const wj = [];
  DIRS.forEach(d => {
    const j = i + d;
    if (d === -11 && i < N) return; if (d === 11 && i >= N * (N - 1)) return;
    if (d === 1 && i % N === N - 1) return; if (d === -1 && i % N === 0) return;
    const c = cs[j];
    if (c && c.k === "mon" && !c.hide) { const m = DATA.monsters[c.id]; if (m.ma >= 1) { wd += m.ma; wj.push(j); } }
  });
  if (wd > 0) {
    if (S.hp <= wd) { log("你将会被巫师杀死…", 1); }
    S.hp -= wd; log("巫师魔法攻击 -" + wd);
    wj.forEach(j => { // 巫师换位
      if (DATA.mmove[f].includes(j)) {
        const t = 2 * j - i;
        if (t >= 0 && t < N * N && !cs[t]) { setCell(f, t, cs[j]); setCell(f, j, null); }
      }
    });
    if (S.hp <= 0) { gameOver(false); return; }
  }
  // 魔法警卫：处于两警卫正中
  for (const d of DIRS) {
    if (d === -1 && i % N === 0) continue;
    if (d === 1 && i % N === N - 1) continue;
    const a = i + d, b = i - d;
    if (a < 0 || a >= N * N || b < 0 || b >= N * N) continue;
    const ca = cs[a], cb = cs[b];
    if (ca && ca.k === "mon" && !ca.hide && ca.id === 130 && cb && cb.k === "mon" && !cb.hide && cb.id === 130) {
      S.hp = Math.ceil(S.hp * 0.5); log("穿过两名魔法警卫之间，生命减半！", 1);
      if (S.hp <= 0) { gameOver(false); return; }
    }
  }
}

/* ---------- 道具使用 ---------- */
function useProp(id) {
  const f = S.floor, cs = cellsOf(f);
  if (id === 20) { // 飞行魔杖：相邻楼梯
    const hi = heroIdx();
    for (const d of DIRS) {
      const j = hi + d;
      const c = cs[j];
      if (c && c.k === "stair") {
        const diff = c.up ? DATA.stairs[f].up.diff : DATA.stairs[f].down.diff;
        const t = f + diff;
        if (t >= 1 && t <= 50 && S.visited[t]) { addProp(20, -1); switchLevel(diff, false); log("飞行魔杖 → " + t + "F"); renderAll(); return; }
      }
    }
    log("飞行魔杖需站在楼梯旁，且只能去已到过的楼层"); return;
  }
  if (id === 21) { // 镐
    const j = heroIdx() + DIRS[S.dir];
    const c = cs[j];
    if (c && c.k === "wall") { setCell(f, j, null); addProp(21, -1); log("挖开了一面墙"); renderAll(); }
    else log("面前不是墙");
    return;
  }
  if (id === 22) { // 地震
    let n = 0; cs.forEach((c, i) => { if (c && c.k === "wall") { setCell(f, i, null); n++; } });
    addProp(22, -1); log("地震术摧毁了 " + n + " 面墙"); renderAll(); return;
  }
  if (id === 23) { // 冰冻
    let n = 0;
    DIRS.forEach(d => { const j = heroIdx() + d; const c = cs[j]; if (c && c.k === "lava") { setCell(f, j, null); n++; } });
    if (!n) { log("周围没有熔岩"); return; }
    addProp(23, -1); log("冻结了 " + n + " 块熔岩"); renderAll(); return;
  }
  if (id === 24) { // 炸弹
    let n = 0;
    DIRS.forEach(d => { const j = heroIdx() + d; const c = cs[j]; if (c && c.k === "mon" && !DATA.monsters[c.id].boss) { const m = monStats(f, j); removeMonster(f, j); S.gold += m.gold; onKill(f, j, m); n++; } });
    if (!n) { log("周围没有可炸的怪物"); return; }
    addProp(24, -1); log("炸弹炸死了 " + n + " 只怪"); renderAll(); return;
  }
  if (id === 25) { // 魔钥匙
    let n = 0; cs.forEach((c, i) => { if (c && c.k === "door" && c.id === 1001) { setCell(f, i, null); n++; } });
    addProp(25, -1); log("魔钥匙打开了 " + n + " 扇黄门"); renderAll(); return;
  }
  if (id === 30 || id === 31) { // 起飞/降落之羽
    const diff = id === 30 ? 1 : -1;
    if (!switchLevel(diff, true)) { log("无法飞往该层"); return; }
    addProp(id, -1); log("飞行器 → " + S.floor + "F"); renderAll(); return;
  }
  if (id === 32) { // 中心飞行器
    const j = N * N - 1 - heroIdx();
    const c = cs[j];
    if (c && (c.k === "wall" || c.k === "mon" || c.k === "npc" || c.k === "door")) { log("中心位置无法到达"); return; }
    addProp(32, -1);
    const [x, y] = XY(j); S.x = x; S.y = y;
    damageCollision(j);
    log("传送到中心对称位置"); renderAll(); return;
  }
}

/* ---------- 渲染 ---------- */
const IMG = {};
function loadImgs() {
  for (const k in DATA.img) {
    const im = new Image();
    im.onload = () => { if (S) draw(); };
    im.src = DATA.img[k];
    IMG[k] = im;
  }
}
const cv = $("#board"), ctx = cv.getContext("2d");
let hoverI = -1;
function draw() {
  const f = S.floor, cs = cellsOf(f);
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let i = 0; i < N * N; i++) {
    const [x, y] = XY(i);
    if (IMG.floor) ctx.drawImage(IMG.floor, x * CELL, y * CELL, CELL, CELL);
  }
  for (let i = 0; i < N * N; i++) {
    const [x, y] = XY(i);
    const c = cs[i]; if (!c) continue;
    if (c.hide && c.k !== "stair") continue;
    let img = null;
    if (c.k === "wall") img = IMG["door1006_0"];
    else if (c.k === "lava") img = IMG["fire_0"];
    else if (c.k === "stair") img = IMG[c.up ? "stair_up" : "stair_down"];
    else if (c.k === "door") { if (c.ds === "a" || c.ds === "h") continue; img = IMG["door" + c.id + "_0"] || IMG["door1006_0"]; }
    else if (c.k === "mon" && !c.big) img = IMG[c.id + "_0"] || IMG["132_0"];
    else if (c.k === "prop") img = IMG["prop" + c.id];
    else if (c.k === "npc") img = IMG[DATA.npcs[c.id].spriteId + "_0"];
    else if (c.k === "ev") img = IMG["star_0"];
    else if (c.k === "shop") img = IMG["pb_m_0"] || IMG["door1006_0"];
    if (img) {
      ctx.globalAlpha = c.k === "stair" && c.hide ? 0.45 : 1;
      ctx.drawImage(img, x * CELL, y * CELL, CELL, CELL);
      ctx.globalAlpha = 1;
    }
  }
  // 大怪 3x3
  for (let i = 0; i < N * N; i++) {

      const [x, y] = XY(c.monI);
      const keys = [1, 2, 3].filter(k => c.keys[k] > 0).map(k => kn[k] + "×" + c.keys[k]).join(" ") || "无";
      const warn = c.warn ? '<div><span class="hw">⚠ 卡关风险：' + c.warn.floor + 'F 起可能无法继续推进</span></div>' : "";
      return '<div class="hint-item" data-f="' + c.f + '" data-i="' + c.monI + '">' +
        '<div><span class="hn">' + c.name + '</span> <span class="hd">' + c.f + 'F · 第' + (y + 1) + '行第' + (x + 1) + '列</span></div>' +
        '<div class="hd">预计损血 <b style="color:var(--red)">' + c.total + '</b>（含沿途强制战斗 ' + c.pathD + ' + 目标 ' + c.battle + '）</div>' +
        '<div class="hd">开门钥匙：' + keys + ' ｜ 金币 +' + c.gold + '</div>' + warn + '</div>';
    }).join("");
    list.querySelectorAll(".hint-item").forEach(el => {
      el.onclick = () => {
        const f = +el.dataset.f, i = +el.dataset.i, [x, y] = XY(i);
        if (f === S.floor) { hoverI = i; draw(); log("已高亮目标：" + (y + 1) + "行" + (x + 1) + "列", 1); }
        else log("目标在 " + f + "F，请先前往该层。");
      };
    });
  }
  btn.onclick = () => {
    if (cooling) return;
    if (panel.classList.contains("show")) { panel.classList.remove("show"); return; }
    panel.classList.add("show");
    list.innerHTML = '<div class="help">计算中…</div>';
    setTimeout(() => {
      let top = [];
      try { top = solve(); } catch (e) { list.innerHTML = '<div class="hw">计算失败：' + e.message + '</div>'; return; }
      render(top);
      cooling = true; let left = 5;
      btn.disabled = true; btn.textContent = "冷却 " + left + "s";
      const tm = setInterval(() => {
        left--;
        if (left <= 0) { clearInterval(tm); cooling = false; btn.disabled = false; btn.textContent = "攻略提示"; }
        else btn.textContent = "冷却 " + left + "s";
      }, 1000);
    }, 30);
  };
  window.__hintSolve = solve;
})();
</script>
</body>
</html>
